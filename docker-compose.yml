version: "3.8"

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: webbanhang_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webbh
      MYSQL_USER: webbh_user
      MYSQL_PASSWORD: webbh_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/webbh.sql.gz:/docker-entrypoint-initdb.d/webbh.sql.gz
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    command: >
      --max_allowed_packet=1G
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=256M
      --innodb_flush_log_at_trx_commit=2
      --innodb_flush_method=O_DIRECT
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # PHP + Apache
  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: webbanhang_web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./WebBanHang:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_NAME: webbh
      DB_USER: webbh_user
      DB_PASSWORD: webbh_password

  # phpMyAdmin (tuỳ chọn)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: webbanhang_phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 1G
    depends_on:
      - mysql

volumes:
  mysql_data:
