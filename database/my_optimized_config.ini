# ================================================================
# CẤU HÌNH MYSQL/MARIADB TỐI ƯU CHO XAMPP LOCALHOST - WINDOWS
# ================================================================
# Copy toàn bộ nội dung này vào file my.ini của XAMPP
# Đường dẫn: C:\xampp\mysql\bin\my.ini
# QUAN TRỌNG: Khởi động lại MySQL sau khi thay đổi!
# ================================================================

[client]
port=3306
socket="C:/xampp/mysql/mysql.sock"
default-character-set=utf8mb4

[mysqld]
# ============================================================
# CẤU HÌNH CƠ BẢN
# ============================================================
port=3306
socket="C:/xampp/mysql/mysql.sock"
basedir="C:/xampp/mysql"
tmpdir="C:/xampp/tmp"
datadir="C:/xampp/mysql/data"
pid_file="mysql.pid"
log_error="mysql_error.log"
plugin_dir="C:/xampp/mysql/lib/plugin/"
server-id=1

# ============================================================
# 1. TỐI ƯU INNODB BUFFER POOL (QUAN TRỌNG NHẤT!)
# ============================================================
# Đặt 50-70% RAM khả dụng
# Máy 8GB RAM -> 4G, Máy 16GB RAM -> 8G, Máy 32GB RAM -> 16G
innodb_buffer_pool_size = 2G
# Chia buffer pool thành nhiều instance (1 instance/GB RAM)
innodb_buffer_pool_instances = 2

# Lưu/nạp trạng thái buffer pool - khởi động nhanh hơn
innodb_buffer_pool_dump_at_shutdown = ON
innodb_buffer_pool_load_at_startup = ON

# ============================================================
# 2. TỐI ƯU QUERY CACHE (CHỈ DÀNH CHO MariaDB)
# ============================================================
# Nếu dùng MySQL 8.0+, comment 4 dòng dưới đây
query_cache_type = 1
query_cache_size = 128M
query_cache_limit = 4M

# ============================================================
# 3. TỐI ƯU BUFFER VÀ CACHE
# ============================================================
# Buffer cho index MyISAM
key_buffer_size = 128M

# Buffer cho sắp xếp (ORDER BY)
sort_buffer_size = 4M

# Buffer cho đọc tuần tự
read_buffer_size = 2M

# Buffer cho đọc ngẫu nhiên
read_rnd_buffer_size = 8M

# Buffer cho JOIN
join_buffer_size = 4M

# Cache cho table definitions
table_definition_cache = 2000
table_open_cache = 4000

# ============================================================
# 4. TỐI ƯU INNODB LOG - GIẢM I/O DISK
# ============================================================
# GIỮ NGUYÊN KÍCH THƯỚC LOG FILE MẶC ĐỊNH ĐỂ TRÁNH LỖI
# Nếu muốn thay đổi: dừng MySQL, xóa ib_logfile0, ib_logfile1, rồi khởi động lại
innodb_log_file_size = 48M

# Buffer cho log
innodb_log_buffer_size = 32M

# Chế độ commit: 2 = cân bằng tốc độ/an toàn cho localhost
innodb_flush_log_at_trx_commit = 2

# ============================================================
# 5. TỐI ƯU I/O - WINDOWS COMPATIBLE
# ============================================================
# KHÔNG sử dụng O_DIRECT hoặc unbuffered trên Windows
# Để MySQL tự chọn phương thức phù hợp

# Số luồng I/O cho đọc/ghi
innodb_read_io_threads = 4
innodb_write_io_threads = 4

# I/O capacity (giảm xuống cho an toàn)
innodb_io_capacity = 1000
innodb_io_capacity_max = 2000

# Cho phép xử lý song song tối đa
innodb_thread_concurrency = 0

# Adaptive hash index
innodb_adaptive_hash_index = ON

# ============================================================
# 6. TỐI ƯU KẾT NỐI VÀ THREAD
# ============================================================
max_connections = 200
wait_timeout = 600
interactive_timeout = 600
thread_cache_size = 50
thread_stack = 256K

# ============================================================
# 7. TỐI ƯU TEMPORARY TABLE
# ============================================================
tmp_table_size = 128M
max_heap_table_size = 128M

# ============================================================
# 8. TỐI ƯU FULLTEXT SEARCH (TIẾNG VIỆT)
# ============================================================
ft_min_word_len = 2
innodb_ft_min_token_size = 2

# ============================================================
# 9. TỐI ƯU NETWORK
# ============================================================
max_allowed_packet = 128M
net_buffer_length = 16K

# ============================================================
# 10. CÀI ĐẶT BỔ SUNG
# ============================================================
log_bin_trust_function_creators = 1
sql_mode = NO_ZERO_IN_DATE,NO_ZERO_DATE,NO_ENGINE_SUBSTITUTION

# Character set UTF8MB4
character-set-server = utf8mb4
collation-server = utf8mb4_general_ci

# InnoDB data files
innodb_data_home_dir = "C:/xampp/mysql/data"
innodb_data_file_path = ibdata1:10M:autoextend
innodb_log_group_home_dir = "C:/xampp/mysql/data"
innodb_lock_wait_timeout = 50

# ============================================================
# CẤU HÌNH CHO MYSQLDUMP
# ============================================================
[mysqldump]
max_allowed_packet = 128M
quick

# ============================================================
# CẤU HÌNH CHO MYSQL CLIENT
# ============================================================
[mysql]
default-character-set = utf8mb4

# ============================================================
# CẤU HÌNH CHO MYISAMCHK
# ============================================================
[myisamchk]
key_buffer = 128M
sort_buffer_size = 128M
read_buffer = 2M
write_buffer = 2M
